name: tests

on:
  push:
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # GitHub's free runners have no GPU, so these run on CPU with tiny
      # models. That covers imports, the compatibility shims, determinism and
      # the equivalence gate at reduced settings. The full regression against
      # published numbers (scripts/run_regression.py) needs the cluster and is
      # deliberately NOT run here.
      - name: Run fast tests
        run: pytest tests/ -v --tb=short
