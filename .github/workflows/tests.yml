name: tests

on:
  push:
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # GitHub's free runners have no GPU, so these run on CPU with tiny
      # models: imports, determinism and the targeted guards. Reproducing the
      # published numbers needs a GPU and is deliberately NOT run here.
      - name: Run fast tests
        run: pytest tests/ -v --tb=short
